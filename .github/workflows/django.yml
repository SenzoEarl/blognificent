name: Django CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.13]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage bandit safety
    
    - name: Create .env file
      run: |
        echo "SECRET_KEY=django-insecure-test-key-for-ci" > .env
        echo "DEBUG=True" >> .env
        echo "EMAIL_HOST_USER=test@example.com" >> .env
        echo "EMAIL_HOST_PASSWORD=testpassword" >> .env
        echo "DEFAULT_FROM_EMAIL=test@example.com" >> .env
    
    - name: Run Tests
      run: |
        python manage.py test
    
    - name: Run Coverage
      run: |
        coverage run --source='.' manage.py test
        coverage report
    
    - name: Run Black
      run: |
        black --check .
    
    - name: Run Security Checks
      run: |
        bandit -r . -x "./venv,./tests"
        safety check

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        cache: 'pip'
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 isort
        pip install -r requirements.txt
    
    - name: Run flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Run isort
      run: |
        isort --check-only --profile black .

  migrations:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        cache: 'pip'
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create .env file
      run: |
        echo "SECRET_KEY=django-insecure-test-key-for-ci" > .env
        echo "DEBUG=True" >> .env
        echo "EMAIL_HOST_USER=test@example.com" >> .env
        echo "EMAIL_HOST_PASSWORD=testpassword" >> .env
        echo "DEFAULT_FROM_EMAIL=test@example.com" >> .env
    
    - name: Check for missing migrations
      run: |
        python manage.py makemigrations --check --dry-run